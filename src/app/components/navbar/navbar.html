<nav class="navbar-container">
  <div class="navbar-wrapper">
    <!-- Logo -->
    <a routerLink="/home" class="logo">
      <i class="fa-solid fa-flask-rocket logo-icon"></i>
      <span>Program<span>Lab</span></span>
    </a>

    <!-- Desktop Navigation -->
    <div class="nav-links">
      <a routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
      <a routerLink="/metodologia" routerLinkActive="active-link" class="nav-link">Metodologia</a>
      <a routerLink="/contato" routerLinkActive="active-link" class="nav-link">Contato</a>
    </div>

    <!-- CTA Button -->
    <div class="nav-actions">
      <a routerLink="/contato" class="btn-cta">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Solicitar Orçamento</span>
      </a>
      
      <!-- Mobile Menu Button -->
      <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Navigation Menu">
        @if (mobileMenuOpen()) {
          <i class="fa-solid fa-xmark"></i>
        } @else {
          <i class="fa-solid fa-bars"></i>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  @if (mobileMenuOpen()) {
    <div class="mobile-dropdown animate-slide-down">
      <a routerLink="/home" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" (click)="mobileMenuOpen.set(false)" class="mobile-link">Home</a>
      <a routerLink="/metodologia" routerLinkActive="active-link" (click)="mobileMenuOpen.set(false)" class="mobile-link">Metodologia</a>
      <a routerLink="/contato" routerLinkActive="active-link" (click)="mobileMenuOpen.set(false)" class="mobile-link">Contato</a>
      <a routerLink="/contato" (click)="mobileMenuOpen.set(false)" class="mobile-btn-cta">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Solicitar Orçamento</span>
      </a>
    </div>
  }
</nav>
